[project]
name = "medical-knowledge-platform"
version = "0.1.0"
description = "Medical Knowledge Infrastructure (MKI) — v0. Claims → Evidence → Consensus → Knowledge."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
# Postgres driver is optional: local dev/tests run on SQLite (RFC-0001 §1).
postgres = [
    "psycopg[binary]>=3.1",
]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
]
# Used only by scripts/gen_rfc*.py to regenerate RFC .docx files.
docs = [
    "python-docx>=1.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
